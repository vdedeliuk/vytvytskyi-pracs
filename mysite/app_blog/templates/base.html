{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мій Блог{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet"> 

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}"> 

    {% block extra_head %}
    {% endblock %}
</head>
<body>
    <div class="container">
        <header class="site-header">
            <div class="logo">
                <a href="{% url 'home' %}">Мій Супер Блог</a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="{% url 'home' %}" class="{% if request.path == '/' %}active{% endif %}">Головна</a></li>
                    <li><a href="{% url 'articles-list' %}" class="{% if 'articles' in request.path %}active{% endif %}">Всі Публікації</a></li>
                    <li><a href="/admin/" class="admin-link" target="_blank">Адмін</a></li> 
            </nav>
        </header>

        <main class="content">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="site-footer">
            <p>&copy; {% now "Y" %} Мій Супер Блог. Всі права захищено.</p>
        </footer>
    </div>

    <script src="{% static 'js/jquery.js' %}" crossorigin="anonymous"></script>
    <script src="{% static 'js/bootstrap.min.js' %}" crossorigin="anonymous"></script>
    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
